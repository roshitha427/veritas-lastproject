name: Project checks
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: veritas_test
          MYSQL_USER: veritas
          MYSQL_PASSWORD: ci-test-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      TEST_DATABASE_URL: mysql+pymysql://veritas:ci-test-password@127.0.0.1:3306/veritas_test
      APP_ENV: development
      EVIDENCE_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build

  container:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: veritas_container_test
          MYSQL_USER: veritas
          MYSQL_PASSWORD: ci-test-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - name: Build full CPU runtime image
        run: docker build --tag veritas-deployment:ci .
      - name: Smoke test production startup with a fresh mounted disk
        shell: bash
        run: |
          sudo mkdir -p "$RUNNER_TEMP/veritas-data"
          sudo chmod 0755 "$RUNNER_TEMP/veritas-data"
          docker run --detach --name veritas-deployment --network host \
            --mount "type=bind,src=$RUNNER_TEMP/veritas-data,dst=/var/data" \
            --env APP_ENV=production \
            --env SECRET_KEY=ci-only-random-session-secret-at-least-32-characters \
            --env COOKIE_SECURE=true \
            --env PUBLIC_BASE_URL=https://container.example.test \
            --env MYSQL_HOST=127.0.0.1 --env MYSQL_DATABASE=veritas_container_test \
            --env MYSQL_USER=veritas --env MYSQL_PASSWORD=ci-test-password \
            --env EVIDENCE_PROVIDER=none veritas-deployment:ci
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5000/api/health > "$RUNNER_TEMP/veritas-health.json"; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          python -c "import json; from pathlib import Path; h=json.loads(Path('$RUNNER_TEMP/veritas-health.json').read_text()); assert h['status']=='ok' and h['database']=='mysql'"
          curl --fail --silent http://127.0.0.1:5000/ | grep --quiet '<html'
          docker exec --user 10001:10001 veritas-deployment python -c "from pathlib import Path; s=Path('/proc/1/status').read_text(); assert next(line for line in s.splitlines() if line.startswith('Uid:')).split()[1:]==['10001']*4; p=Path('/var/data/disk-check'); p.write_text('ok'); p.unlink()"
          docker stop --time 10 veritas-deployment
          test "$(docker inspect --format '{{.State.ExitCode}}' veritas-deployment)" = 0
      - name: Container logs
        if: failure()
        run: docker logs veritas-deployment
      - name: Stop smoke container
        if: always()
        run: docker rm --force veritas-deployment || true
